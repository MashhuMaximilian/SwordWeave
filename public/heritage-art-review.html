<style>
:root{color-scheme:dark;--gold:#d4b472;--muted:#b8b0a0;--line:#8d744442}
*{box-sizing:border-box}body{margin:0;color:#f1e9d9;background:radial-gradient(ellipse at 10% 0,#28261f,transparent 45%),#0e141c;font:16px system-ui,sans-serif;min-height:100vh}
header,main{max-width:1600px;margin:auto;padding:clamp(18px,3vw,44px)}header{padding-bottom:20px}
.eyebrow{color:var(--gold);font-size:.75rem;text-transform:uppercase;letter-spacing:.18em}h1{font:clamp(2rem,4vw,3.5rem) Georgia,serif;letter-spacing:-.03em;margin:12px 0}header p{color:var(--muted);line-height:1.6;margin:8px 0}
.toolbar{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:28px;border-block:1px solid var(--line);padding:18px 0}
[role=tablist]{display:flex;gap:8px;flex-wrap:wrap}[role=tab]{font:inherit;border:1px solid #79633d;background:#141b23;color:#d8d0c1;padding:12px 18px;border-radius:9px;cursor:pointer;white-space:nowrap}[role=tab] span{font-size:.8rem;margin-left:10px;opacity:.7}[role=tab][aria-selected=true]{background:linear-gradient(135deg,#dbbe7d,#ad8748);color:#181914;border-color:#eed8a5;box-shadow:inset 0 1px 0 #fff5}
.search{display:flex;flex-direction:column;gap:6px;flex:1;max-width:330px;min-width:180px}.search span{font-size:.75rem;color:var(--muted)}input{width:100%;font:inherit;background:#0b1118;color:#eee3cc;border:1px solid #8e815d;border-radius:8px;padding:11px 14px}button:focus-visible,input:focus-visible{outline:2px solid #f0d18a;outline-offset:4px}
#result-status{font-size:.85rem;color:var(--muted);margin-top:16px}main{padding-top:0}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:24px}
figure{margin:0;border:1px solid #8d7444;border-radius:12px;overflow:hidden;background:#151c25;box-shadow:0 8px 28px #0003}figure[hidden]{display:none}img{display:block;width:100%;height:auto;aspect-ratio:2/3;object-fit:contain;background:#111820}figcaption{padding:16px 18px;border-top:1px solid var(--line)}h2{font:1.2rem Georgia,serif;margin:0 0 8px}figcaption span{color:var(--gold);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}#empty{color:var(--muted);padding:24px 0}
@media(max-width:600px){.toolbar{gap:16px}[role=tablist]{width:100%;gap:6px}[role=tab]{flex:1;padding:11px 9px;font-size:.85rem}[role=tab] span{margin-left:5px}.search{max-width:none;width:100%}.gallery{gap:18px}}
</style>
</head>

<div class="eyebrow">SwordWeave · Art review</div>
<h1>Heritage portraits</h1>
<p>108 approved illustrations, organized by heritage. Full artwork is shown without cropping.</p>

<script>
const tabs=[...document.querySelectorAll('[role="tab"]')];
const portraits=[...document.querySelectorAll('figure')];
const search=document.getElementById('search');
const gallery=document.getElementById('gallery');
let active=tabs[0];
function update(){
  const query=search.value.trim().toLocaleLowerCase();
  let count=0;
  for(const portrait of portraits){
    const visible=portrait.dataset.kind===active.dataset.kind&&portrait.dataset.name.includes(query);
    portrait.hidden=!visible;if(visible)count++;
  }
  document.getElementById('result-status').textContent=count+' '+active.dataset.kind.toLowerCase()+(count===1?'':'s')+(query?' matching “'+search.value.trim()+'”':'');
  document.getElementById('empty').hidden=count!==0;
}
function activate(tab){
  active=tab;
  for(const item of tabs){const selected=item===tab;item.setAttribute('aria-selected',String(selected));item.tabIndex=selected?0:-1;}
  gallery.setAttribute('aria-labelledby',tab.id);update();
}
for(const tab of tabs){
  tab.addEventListener('click',()=>activate(tab));
  tab.addEventListener('keydown',event=>{
    const index=tabs.indexOf(tab);let next;
    if(event.key==='ArrowRight')next=tabs[(index+1)%tabs.length];
    if(event.key==='ArrowLeft')next=tabs[(index+tabs.length-1)%tabs.length];
    if(event.key==='Home')next=tabs[0];if(event.key==='End')next=tabs[tabs.length-1];
    if(next){event.preventDefault();activate(next);next.focus();}
  });
}
search.addEventListener('input',update);
</script>
